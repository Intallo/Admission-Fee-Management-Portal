name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Unit Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_pub_ci_dummy_publishable_key_1234567890
      SUPABASE_SERVICE_ROLE_KEY: sb_srv_ci_dummy_service_role_key_1234567890
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Validate TypeScript Types
        run: npm run typecheck

      - name: Execute Unit Tests
        run: npm test

      - name: Verify Production Next.js Build
        run: npm run build
        env:
          NODE_ENV: production
