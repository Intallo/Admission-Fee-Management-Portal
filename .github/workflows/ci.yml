name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'task/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Unit Test, PostgreSQL Integration & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: school_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_pub_ci_dummy_publishable_key_1234567890
      SUPABASE_SERVICE_ROLE_KEY: sb_srv_ci_dummy_service_role_key_1234567890
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/school_test_db
      ALLOW_REMOTE_DATABASE: "false"
      ACTOR_SIGNING_SECRET: school-app-actor-signing-secret-default-key-2026

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply Database Migrations
        run: |
          export PGPASSWORD=postgrespassword
          for file in $(ls supabase/migrations/*.sql | sort); do
            if [[ "$file" != *".down.sql" ]]; then
              echo "==> Applying migration: $file"
              psql -h localhost -U postgres -d school_test_db -v ON_ERROR_STOP=1 -f "$file"
            fi
          done

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Validate TypeScript Types
        run: npm run typecheck

      - name: Execute Vitest Suite & PostgreSQL Integration Tests
        run: npx vitest run

      - name: Verify Production Next.js Build
        run: npm run build
        env:
          NODE_ENV: production
